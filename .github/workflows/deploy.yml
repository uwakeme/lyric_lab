name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 前端构建 ==========
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # ========== 后端构建 ==========
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Build backend
        working-directory: ./server
        run: npm run build

      # ========== 部署到服务器 ==========
      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/frontend/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/server/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            BACKUP_DIR="${DEPLOY_DIR}/backup_${TIMESTAMP}"

            echo "备份旧版本..."
            if [ -d "${DEPLOY_DIR}/frontend" ]; then
              mkdir -p ${BACKUP_DIR}
              cp -r ${DEPLOY_DIR}/frontend ${BACKUP_DIR}/ 2>/dev/null || true
              cp -r ${DEPLOY_DIR}/server ${BACKUP_DIR}/ 2>/dev/null || true
              echo "备份完成"
            fi

            echo "停止旧的后端服务..."
            cd ${DEPLOY_DIR}/server && pm2 stop lyriclab-server 2>/dev/null || true
            pm2 delete lyriclab-server 2>/dev/null || true

            echo "安装后端依赖..."
            cd ${DEPLOY_DIR}/server
            npm install --production

            echo "启动后端服务..."
            pm2 start ecosystem.config.js --env production 2>/dev/null || pm2 start dist/index.js --name lyriclab-server

            echo "部署完成!"

      - name: Deploy frontend to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            FRONTEND_DEST="${{ secrets.NGINX_WEB_ROOT || '/var/www/lyriclab' }}"

            echo "复制前端文件到 Nginx 目录..."
            cp -r ${DEPLOY_DIR}/frontend/* ${FRONTEND_DEST}/

            echo "重新加载 Nginx..."
            nginx -t && nginx -s reload || echo "Nginx 配置或重载失败"

      - name: Health check
        run: |
          echo "等待服务启动..."
          sleep 10
          echo "检查后端服务状态..."
          curl -f ${{ secrets.VITE_API_BASE_URL }}/health || echo "后端健康检查失败（可能是 /health 端点不存在）"
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## 部署结果"
          echo "- 前端构建: ${{ job.status }}"
          echo "- 后端构建: ${{ job.status }}"
          echo "- 服务器部署: ${{ job.status }}"