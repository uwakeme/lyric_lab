name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 前端构建 ==========
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # ========== 后端构建 ==========
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Build backend
        working-directory: ./server
        run: npm run build

      # ========== 部署到服务器 ==========
      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/frontend ${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/server ${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/logs"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/frontend/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/dist/* ./server/package.json ./server/package-lock.json ./server/prisma ./server/lyriclab-pm2.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/server/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH,DATABASE_URL
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            BACKUP_DIR="${DEPLOY_DIR}/backup_${TIMESTAMP}"

            echo "备份旧版本..."
            if [ -d "${DEPLOY_DIR}/frontend" ]; then
              mkdir -p ${BACKUP_DIR}
              cp -r ${DEPLOY_DIR}/frontend ${BACKUP_DIR}/ 2>/dev/null || true
              cp -r ${DEPLOY_DIR}/server ${BACKUP_DIR}/ 2>/dev/null || true
              echo "备份完成"
            fi

            echo "确保日志目录存在..."
            mkdir -p ${DEPLOY_DIR}/logs

            echo "确保 .env 存在..."
            # 只在缺失时创建，不覆盖服务器上手动维护的 .env（里面有 JWT_SECRET 等密钥）
            if [ ! -f "${DEPLOY_DIR}/server/.env" ]; then
              echo "DATABASE_URL=${DATABASE_URL}" > ${DEPLOY_DIR}/server/.env
              echo ">> 已创建初始 .env（仅含 DATABASE_URL），请手动补充 JWT_SECRET / JWT_REFRESH_SECRET，否则后端会启动失败"
            fi

            echo "停止旧的后端服务..."
            pm2 delete lyriclab-server 2>/dev/null || true

            echo "安装后端依赖..."
            cd ${DEPLOY_DIR}/server
            # --ignore-scripts 跳过 postinstall 钩子，避免 prisma generate 在没有 DATABASE_URL 的环境下失败
            # 运行时直接用预编译的 @prisma/client，不需要重新生成
            npm install --production --ignore-scripts

            echo "应用数据库迁移..."
            npx prisma migrate deploy

            echo "用 PM2 配置文件启动后端服务..."
            # PM2 启动文件 server/lyriclab-pm2.json 已随上面的文件复制步骤上传，这里校验一下
            if [ ! -f "${DEPLOY_DIR}/server/lyriclab-pm2.json" ]; then
              echo "错误: 未找到 ${DEPLOY_DIR}/server/lyriclab-pm2.json，请检查文件复制步骤是否成功"
              exit 1
            fi
            # 服务意外停止时，在服务器上手动重启：
            #   pm2 restart lyriclab-server 或
            #   cd ${DEPLOY_DIR}/server && pm2 start lyriclab-pm2.json
            pm2 start ${DEPLOY_DIR}/server/lyriclab-pm2.json
            pm2 save

            echo "部署完成!"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PATH: "/home/ubuntu/.nvm/versions/node/v26.2.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      - name: Deploy frontend to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            FRONTEND_DEST="${{ secrets.NGINX_WEB_ROOT || '/var/www/html' }}"

            echo "复制前端文件到 Nginx 目录 (${DEPLOY_DIR}/frontend -> ${FRONTEND_DEST})..."
            # 源和目标相同时跳过（避免 cp 把目录拷进自己）
            if [ "${DEPLOY_DIR}/frontend" = "${FRONTEND_DEST}" ]; then
              echo "源与目标相同，跳过复制"
            else
              mkdir -p ${FRONTEND_DEST}
              cp -r ${DEPLOY_DIR}/frontend/. ${FRONTEND_DEST}/
            fi

            echo "重新加载 Nginx..."
            nginx -t && nginx -s reload || echo "Nginx 配置或重载失败"

      - name: Health check
        run: |
          echo "等待服务启动..."
          sleep 10
          echo "检查后端服务状态..."
          # -s 静默（不打进度条）
          # --connect-timeout 5：5 秒内连不上就放弃
          # --max-time 15：整个请求最多 15 秒
          # -w 打印 HTTP 状态码，-o /dev/null 丢掉 body
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 15 \
            "${{ secrets.VITE_API_BASE_URL }}/health" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ 后端健康检查通过 (HTTP $HTTP_CODE)"
          else
            echo "✗ 后端健康检查失败 (HTTP $HTTP_CODE) — /health 端点可能不存在"
          fi
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## 部署结果"
          echo "- 前端构建: ${{ job.status }}"
          echo "- 后端构建: ${{ job.status }}"
          echo "- 服务器部署: ${{ job.status }}"