name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 前端构建 ==========
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # ========== 后端构建 ==========
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Build backend
        working-directory: ./server
        run: npm run build

      # ========== 部署到服务器 ==========
      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./frontend/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/frontend/
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -P ${{ secrets.SERVER_PORT || 22 }} -r ./server/dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}/server/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PATH
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            BACKUP_DIR="${DEPLOY_DIR}/backup_${TIMESTAMP}"

            echo "备份旧版本..."
            if [ -d "${DEPLOY_DIR}/frontend" ]; then
              mkdir -p ${BACKUP_DIR}
              cp -r ${DEPLOY_DIR}/frontend ${BACKUP_DIR}/ 2>/dev/null || true
              cp -r ${DEPLOY_DIR}/server ${BACKUP_DIR}/ 2>/dev/null || true
              echo "备份完成"
            fi

            echo "停止旧的后端服务..."
            pm2 delete lyriclab-server 2>/dev/null || true

            echo "安装后端依赖..."
            cd ${DEPLOY_DIR}/server
            npm install --production

            echo "启动后端服务..."
            # --cwd 必须显式指定到 server 目录，否则 require('./routes/auth') 会从错的目录解析
            pm2 start app.js --name lyriclab-server --interpreter node --cwd ${DEPLOY_DIR}/server
            pm2 save

            echo "部署完成!"
        env:
          PATH: "/home/ubuntu/.nvm/versions/node/v26.2.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      - name: Deploy frontend to Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR || '/var/www/lyriclab' }}"
            FRONTEND_DEST="${{ secrets.NGINX_WEB_ROOT || '/var/www/html' }}"

            echo "复制前端文件到 Nginx 目录 (${DEPLOY_DIR}/frontend -> ${FRONTEND_DEST})..."
            # 源和目标相同时跳过（避免 cp 把目录拷进自己）
            if [ "${DEPLOY_DIR}/frontend" = "${FRONTEND_DEST}" ]; then
              echo "源与目标相同，跳过复制"
            else
              mkdir -p ${FRONTEND_DEST}
              cp -r ${DEPLOY_DIR}/frontend/. ${FRONTEND_DEST}/
            fi

            echo "重新加载 Nginx..."
            nginx -t && nginx -s reload || echo "Nginx 配置或重载失败"

      - name: Health check
        run: |
          echo "等待服务启动..."
          sleep 10
          echo "检查后端服务状态..."
          # -s 静默（不打进度条）
          # --connect-timeout 5：5 秒内连不上就放弃
          # --max-time 15：整个请求最多 15 秒
          # -w 打印 HTTP 状态码，-o /dev/null 丢掉 body
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 15 \
            "${{ secrets.VITE_API_BASE_URL }}/health" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ 后端健康检查通过 (HTTP $HTTP_CODE)"
          else
            echo "✗ 后端健康检查失败 (HTTP $HTTP_CODE) — /health 端点可能不存在"
          fi
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## 部署结果"
          echo "- 前端构建: ${{ job.status }}"
          echo "- 后端构建: ${{ job.status }}"
          echo "- 服务器部署: ${{ job.status }}"